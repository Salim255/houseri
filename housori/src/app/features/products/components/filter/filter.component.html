<form
    class="filter"
    [formGroup]="filterFormFields">

    <!-- =======================================================
         SEARCH
    ======================================================== -->

    <section class="filter__row">

        <div class="filter__field filter__field--search">

            <label for="search">
                Search Products
            </label>

            <input
                id="search"
                type="text"
                formControlName="search"
                placeholder="Search furniture..." />

        </div>

        <div class="filter__actions">

            <app-button
                variant="primary"
                (click)="submitSearch()">

                Search

            </app-button>

            <app-button
                variant="secondary"
                (click)="resetFilter()">

                Reset

            </app-button>

        </div>

    </section>


    <!-- =======================================================
         FILTERS
    ======================================================== -->

    <section class="filter__row">

        <div class="filter__field">

            <label>
                Category
            </label>

            <app-custom-select
                formControlName="category"
                [options]="metaData.categories || []">

            </app-custom-select>

        </div>


        <div class="filter__field">

            <label>
                Company
            </label>

            <app-custom-select
                formControlName="company"
                [options]="metaData.companies || []">

            </app-custom-select>

        </div>


        <div class="filter__field">

            <label>
                Sort By
            </label>

            <app-custom-select
                formControlName="alphaSort"
                [options]="sortOptions">

            </app-custom-select>

        </div>

    </section>


    <!-- =======================================================
         PRICE + SHIPPING
    ======================================================== -->

    <section class="filter__row">

        <div class="filter__field filter__field--price">

            <div class="price-range__header">

                <label>
                    Price
                </label>

                <output>

                    {{ priceValue() | currency }}

                </output>

            </div>

            <ion-range
                formControlName="price"
                [min]="10"
                [max]="100000"
                [step]="100">

            </ion-range>

        </div>


        <div class="filter__shipping">

            <label>

                Free Shipping

            </label>

            <ion-toggle
                formControlName="shipping">

            </ion-toggle>

        </div>

    </section>

</form>
